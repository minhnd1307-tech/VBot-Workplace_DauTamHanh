<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker>
</defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">Connectors SaaS: agent hành động bằng OAuth ủy nhiệm của chính người dùng, scope tối thiểu</text><rect x="1270" y="24" width="87" height="18" rx="9" fill="#202124"/><text x="1313.5" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">connectors</text><rect x="1363" y="24" width="94.3" height="18" rx="9" fill="#202124"/><text x="1410.15" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">secrets_kms</text><rect x="20" y="70" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="32" y="93.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Người dùng (A)</text><text x="32" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Bấm "Kết nối Google/M365"</text><text x="32" y="130.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Xem và đồng ý từng scope</text><text x="32" y="147.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Thu hồi bất kỳ lúc nào</text><rect x="1370" y="70" width="210" height="180" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/><text x="1382" y="93.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">OAuth server SaaS</text><text x="1382" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Google Identity</text><text x="1382" y="130.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Microsoft Entra ID</text><text x="1382" y="147.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Atlassian (3LO)</text><text x="1382" y="164.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Notion OAuth</text><text x="1382" y="181.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Auth code + PKCE</text><rect x="1370" y="316" width="210" height="226" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/><text x="1382" y="339.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">SaaS API</text><text x="1382" y="359.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gmail, Drive, Calendar</text><text x="1382" y="376.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Outlook, OneDrive,</text><text x="1382" y="393.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">SharePoint, Teams (Graph)</text><text x="1382" y="410.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Jira, Confluence, Notion</text><text x="1382" y="427.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="1382" y="444.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gửi push / webhook</text><text x="1382" y="461.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">khi dữ liệu thay đổi</text><rect x="250" y="100" width="1090" height="618" rx="10" fill="#F5F9FF" stroke="#4285F4" stroke-width="2"/><text x="266" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4285F4">Google Cloud · asia-southeast1 · GKE private cluster (3 zone)</text><rect x="270" y="146" width="300" height="150" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="282" y="169.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">connector-gateway (GKE)</text><text x="282" y="189.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Nhận callback, kiểm tra state + PKCE</text><text x="282" y="206.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Đổi code lấy refresh token</text><text x="282" y="223.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gắn token với user_id từ SSO</text><text x="282" y="240.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ trả access token cho</text><text x="282" y="257.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">đúng chủ sở hữu</text><rect x="282" y="270" width="87" height="18" rx="9" fill="#202124"/><text x="325.5" y="283" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">connectors</text><rect x="640" y="146" width="300" height="150" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="652" y="169.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Token vault</text><text x="652" y="189.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Secret Manager, 1 secret/user/SaaS</text><text x="652" y="206.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Mã hóa CMEK (Cloud KMS)</text><text x="652" y="223.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ connector-gateway có quyền</text><text x="652" y="240.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Access token cache Redis ≤ 50 phút</text><text x="652" y="257.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Thu hồi: xóa secret + revoke</text><rect x="652" y="270" width="94.3" height="18" rx="9" fill="#202124"/><text x="699.15" y="283" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">secrets_kms</text><rect x="1010" y="146" width="310" height="150" rx="10" fill="#F3FBF5" stroke="#34A853" stroke-width="1.5"/><text x="1022" y="169.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Cloud NAT · IP tĩnh</text><text x="1022" y="189.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Đường ra Internet duy nhất</text><text x="1022" y="206.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">SaaS có thể whitelist IP</text><text x="1022" y="223.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Sandbox không có egress</text><rect x="1022" y="270" width="65.1" height="18" rx="9" fill="#202124"/><text x="1054.55" y="283" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">network</text><rect x="270" y="316" width="520" height="226" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/><text x="282" y="339.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">B. Gọi API trực tiếp khi cần (dữ liệu tươi, hành động)</text><text x="282" y="359.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gmail, Outlook, Calendar, Teams, Jira</text><text x="282" y="376.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Agent gọi tool → connector-gateway lấy token của</text><text x="282" y="393.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  ĐÚNG user đang chat → gọi API qua Cloud NAT</text><text x="282" y="410.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Hành động ghi (gửi mail, tạo ticket, sửa trang)</text><text x="282" y="427.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  dừng chờ người dùng bấm xác nhận (H4)</text><text x="282" y="444.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Ưu: luôn mới, không lưu bản sao. Nhược: phụ thuộc</text><text x="282" y="461.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  rate limit SaaS → token bucket theo user trong Redis</text><rect x="282" y="516" width="87" height="18" rx="9" fill="#202124"/><text x="325.5" y="529" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">connectors</text><rect x="375" y="516" width="87" height="18" rx="9" fill="#202124"/><text x="418.5" y="529" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">governance</text><rect x="810" y="316" width="510" height="226" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="822" y="339.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">A. Đồng bộ trước vào index (tài liệu, wiki)</text><text x="822" y="359.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Drive, OneDrive/SharePoint, Confluence, Notion</text><text x="822" y="376.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Pub/Sub nhận push (Drive changes.watch, Graph</text><text x="822" y="393.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  subscription, Confluence/Jira webhook)</text><text x="822" y="410.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">+ Cloud Scheduler delta sync 15 phút giờ hành chính</text><text x="822" y="427.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">→ Cloud Tasks connector-sync (backoff 10s→300s)</text><text x="822" y="444.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">→ tách chunk, embedding, lưu ACL gốc vào pgvector</text><text x="822" y="461.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Ưu: tìm nhanh, lọc quyền trong DB. Nhược: trễ ≤ 15 phút</text><rect x="822" y="516" width="87" height="18" rx="9" fill="#202124"/><text x="865.5" y="529" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">connectors</text><rect x="915" y="516" width="79.7" height="18" rx="9" fill="#202124"/><text x="954.85" y="529" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">vector_db</text><rect x="1000.7" y="516" width="94.3" height="18" rx="9" fill="#202124"/><text x="1047.8500000000001" y="529" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">cache_queue</text><path d="M230,86 L1366,86" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><circle cx="700" cy="86" r="11" fill="#5F6368"/><text x="700" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="718" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368">Đồng ý scope tại trang của SaaS</text><path d="M1370,134 L420,134 L420,142" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><circle cx="1120" cy="134" r="11" fill="#1A73E8"/><text x="1120" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1138" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#202124">code + PKCE (redirect qua LB)</text><path d="M570,221 L636,221" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><circle cx="603" cy="221" r="11" fill="#1A73E8"/><text x="603" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M940,221 L1006,221" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><circle cx="973" cy="221" r="11" fill="#1A73E8"/><text x="973" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M1320,260 Q1352,280 1366,320" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><path d="M1370,470 L1324,470" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="270" y="556" width="1050" height="150" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/><text x="286" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Scope tối thiểu theo từng SaaS (* = ghi, cần người dùng xác nhận trước khi agent thực hiện)</text><text x="286" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#202124">Google</text><text x="420" y="606" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#202124">gmail.readonly, gmail.compose*, drive.readonly, calendar.events*</text><text x="1304" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">Không xin gmail.modify, drive (full)</text><text x="286" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#202124">Microsoft Graph</text><text x="420" y="630" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#202124">Mail.Read, Mail.Send*, Files.Read.All, Calendars.ReadWrite*, offline_access</text><text x="1304" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">Delegated, không application permission</text><text x="286" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#202124">Atlassian</text><text x="420" y="654" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#202124">read:jira-work, write:jira-work*, read:confluence-content.all, offline_access</text><text x="1304" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">Token 3LO theo từng user</text><text x="286" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#202124">Notion</text><text x="420" y="678" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#202124">User tự chọn trang chia sẻ cho integration; read content, insert content*</text><text x="1304" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">3 request/giây mỗi integration</text><rect x="24" y="730" width="1552" height="150" rx="10" fill="#F1F3F4"/><text x="40" y="758" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Vì sao agent của user A không dùng được quyền của user B</text><text x="40" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">1. Không có service account đọc toàn tập đoàn: mọi lệnh gọi SaaS dùng token ủy nhiệm của chính người đang chat (H2).</text><text x="40" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">2. connector-gateway tra token theo user_id lấy từ phiên SSO đã xác thực, không theo tham số do LLM sinh ra; LLM không bao giờ thấy token.</text><text x="40" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">3. Dữ liệu đồng bộ vào index mang theo ACL gốc (người, nhóm, domain); thu hồi quyền ở SaaS → webhook cập nhật ACL → biến mất khỏi kết quả.</text><text x="40" y="842" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">4. Lưu lượng: ~20.000 lượt gọi/ngày (10/user); rate limit theo user + Cloud Tasks backoff khi SaaS trả 429; event lỗi 10 lần vào DLQ.</text><text x="40" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">5. Chi phí connectors 1,75 USD/tháng: API SaaS nằm trong license tập đoàn, worker nằm trong compute, egress nằm trong network.</text></svg>