<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
</defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">Slide 8: Cô lập Sandbox chạy Code bằng gVisor (H3) &amp; NetworkPolicy chặn Egress</text><rect x="1340" y="24" width="65.1" height="18" rx="9" fill="#202124"/><text x="1372.55" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">sandbox</text><rect x="1340" y="46" width="65.1" height="18" rx="9" fill="#202124"/><text x="1372.55" y="59" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">compute</text><rect x="30" y="90" width="320" height="710" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="42" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">1. Điều phối Tác vụ Agent</text><text x="42" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Người dùng yêu cầu chạy script phân tích,</text><text x="42" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">xử lý dữ liệu bảng tính, vẽ biểu đồ</text><text x="42" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Orchestrator nhận lệnh và sinh code</text><text x="42" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gán quota: CPU 1 vCPU, RAM 2 GB</text><text x="42" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Giới hạn thời gian: timeout 60 giây</text><text x="42" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gửi code qua internal gRPC:</text><text x="42" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ qua cluster IP nội bộ</text><text x="42" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không mount volume nhạy cảm</text><circle cx="50" cy="150" r="11" fill="#1A73E8"/><text x="50" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="50" y="370" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="62" y="393.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">agent-coordinator pod</text><text x="62" y="413.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Namespace: vbot-core</text><text x="62" y="430.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gửi code + dataset tạm</text><text x="62" y="447.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Nhận kết quả (stdout/ảnh)</text><text x="62" y="464.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không cho agent quyền root</text><rect x="380" y="90" width="760" height="710" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="392" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">2. Node Pool Sandbox gVisor (Cô lập tầng Kernel)</text><text x="392" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">GKE Standard Node Pool chuyên dụng: sandbox_config { sandbox_type = "gvisor" }</text><text x="392" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Taint: sandbox.gke.io/runtime=gvisor:NoSchedule (ngăn pod thường chạy nhầm)</text><circle cx="400" cy="150" r="11" fill="#1A73E8"/><text x="400" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="410" y="180" width="700" height="360" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="422" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#202124">Kiến trúc Container gVisor (runsc runtime)</text><rect x="430" y="230" width="660" height="70" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/><text x="442" y="253.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">User Application: Python 3 Code Execution</text><text x="442" y="273.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Code do LLM sinh ra chạy trong sandbox · Bị hạn chế quyền non-root (UID 10001)</text><rect x="430" y="320" width="660" height="90" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="442" y="343.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">gVisor Sentry (User-Space Kernel bằng Go)</text><text x="442" y="363.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Đánh chặn và xử lý trực tiếp toàn bộ Linux Syscalls trong user-space</text><text x="442" y="380.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">CHẶN: ptrace, raw socket, setns, chroot breakout, bpf, load module</text><text x="442" y="397.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không bao giờ để mã độc chạm trực tiếp vào Host Linux Kernel</text><rect x="430" y="430" width="660" height="80" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/><text x="442" y="453.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Host Linux Kernel &amp; Bare-Metal Worker</text><text x="442" y="473.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Host chỉ thấy tiến trình gVisor Sentry như một ứng dụng thông thường</text><text x="442" y="490.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không thể tấn công kernel privilege escalation / container breakout</text><rect x="410" y="560" width="700" height="220" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="1.5"/><text x="422" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Vòng đời Ephemeral &amp; Tiêu hủy Pod (H3)</text><text x="422" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Mỗi phiên chạy code là 1 Pod hoàn toàn mới (Single-use Ephemeral Pod)</text><text x="422" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Bộ nhớ tạm: emptyDir { medium: "Memory" } dung lượng tối đa 500 MB</text><text x="422" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Sau 60s hoặc khi chạy xong: Pod bị FORCE DESTROY ngay lập tức</text><text x="422" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Dữ liệu tạm, biến môi trường và file trung gian bị xóa sạch 100%</text><text x="422" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không lưu vết, không rò rỉ trạng thái giữa các lần thực thi</text><rect x="1170" y="90" width="400" height="710" rx="10" fill="#F3FBF5" stroke="#34A853" stroke-width="1.5"/><text x="1182" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">3. NetworkPolicy: Tuyệt đối chặn Egress</text><text x="1182" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chặn toàn bộ Egress ra bên ngoài:</text><text x="1182" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Pod không thể kết nối Internet (0.0.0.0/0)</text><text x="1182" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Ngăn chặn rò rỉ dữ liệu (Exfiltration)</text><text x="1182" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="1182" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chặn Endpoint GCP Metadata: 169.254.169.254/32</text><text x="1182" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Mã độc không thể lấy Service Account Token!</text><text x="1182" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="1182" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ mở cổng DNS 53 (kube-dns nội bộ)</text><text x="1182" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ nhận lệnh từ agent-coordinator:8080</text><circle cx="1190" cy="150" r="11" fill="#1A73E8"/><text x="1190" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1190" y="420" width="360" height="160" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="1202" y="443.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Tường lửa Chặn Egress</text><text x="1202" y="463.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5F6368">DROP 0.0.0.0/0 (Internet)</text><text x="1202" y="480.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5F6368">DROP 169.254.169.254 (Metadata)</text><text x="1202" y="497.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5F6368">ALLOW cluster DNS:53</text><text x="1202" y="514.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5F6368">ALLOW Ingress từ Core:8080</text><path d="M 330 450 L 410 450" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arr)"/><path d="M 1110 450 L 1170 450" fill="none" stroke="#202124" stroke-width="3" marker-end="url(#arrR)"/><rect x="30" y="818" width="1540" height="64" rx="10" fill="#EAF2FE"/><text x="50" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Thỏa mãn H3: Cô lập tuyệt đối môi trường chạy code bằng microVM/gVisor. Chặn 100% Egress Internet và Cloud Metadata.</text><text x="50" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368">Mã Terraform có sẵn trong modules/security_sandbox. Sizing: 2 node c2-standard-4 giờ HC + 1 staging Spot = 228.80 USD/tháng.</text></svg>