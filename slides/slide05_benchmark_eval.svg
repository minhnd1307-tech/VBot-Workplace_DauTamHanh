<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F9FAFB"/>
  <text x="60" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">Slide 5: So sánh Công nghệ &amp; Đo Benchmark Chất lượng Đạt $ge$ 95% (H8)</text>
  <text x="60" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4B5563">Phân tích điểm hòa vốn định lượng (API vs Tự host GPU) và Kết quả kiểm định Eval Gate trên Golden Dataset 500 mẫu</text><rect x="60" y="140" width="710" height="680" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="80" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">1. So sánh: Serverless API vs Tự Host GPU trên GKE</text><text x="80" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Phân tích điểm hòa vốn (Break-even Analysis)</text><rect x="80" y="210" width="670" height="38" fill="#EFF6FF"/><text x="95" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">Tiêu chí</text><text x="260" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">Serverless API (Vertex AI)</text><text x="500" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#B91C1C">Tự Host GPU (A100 + Llama 3)</text><rect x="80" y="250" width="670" height="56" fill="#FFFFFF"/><text x="95" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Phần cứng GPU</text><text x="260" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">0 USD (Pay-as-you-go)</text><text x="500" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">15.000 – 18.000 USD / tháng</text><rect x="80" y="308" width="670" height="56" fill="#F9FAFB"/><text x="95" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Lãng phí ngoài giờ</text><text x="260" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">0 USD (Đêm/cuối tuần = $0)</text><text x="500" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">Lãng phí 65% (GPU chạy không tải)</text><rect x="80" y="366" width="670" height="56" fill="#FFFFFF"/><text x="95" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Nhân lực MLOps</text><text x="260" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">0 USD (SRE kiêm nhiệm)</text><text x="500" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">+7.000 USD / tháng (2 FTE trực đêm)</text><rect x="80" y="424" width="670" height="56" fill="#F9FAFB"/><text x="95" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Độ tin cậy &amp; HA</text><text x="260" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">SLA 99.95% của Google</text><text x="500" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">Tự xử lý sập driver, OOM</text><rect x="80" y="482" width="670" height="56" fill="#FFFFFF"/><text x="95" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Tổng chi phí / tháng</text><text x="260" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">3.431 USD / tháng</text><text x="500" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">23.000 – 25.500 USD / tháng</text><rect x="80" y="540" width="670" height="56" fill="#F9FAFB"/><text x="95" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Điểm hòa vốn</text><text x="260" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Tối ưu tuyệt đối ở 2k DAU</text><text x="500" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#B91C1C">Chỉ hòa vốn khi &gt;= 55.000 DAU</text><rect x="80" y="630" width="670" height="150" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="105" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">💡 KẾT LUẬN FINOPS TRƯỚC HỘI ĐỒNG:</text><text x="105" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1F2937">• Giải pháp Serverless Vertex AI RẺ HƠN GẤP 7 LẦN so với việc tự dựng cụm GPU.</text><text x="105" y="730" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1F2937">• Tại quy mô 2.000 DAU, tự thuê GPU là lãng phí nghiêm trọng ngân sách doanh nghiệp.</text><text x="105" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1F2937">• Điểm hòa vốn chỉ xảy ra khi vượt 55.000 DAU. Lựa chọn Vertex AI là quyết định tối ưu 100%.</text><rect x="810" y="140" width="730" height="680" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="830" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">2. Kết quả Đo Benchmark Chất lượng Eval Gate (H8)</text><text x="830" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">LLM-as-a-Judge trên Golden Dataset 500 mẫu vs GPT-4o</text><rect x="830" y="210" width="690" height="38" fill="#F5F3FF"/><text x="845" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">Tác vụ</text><text x="1030" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4B5563">Mẫu</text><text x="1110" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4B5563">GPT-4o (Ref)</text><text x="1240" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">VBot (Gemini)</text><text x="1390" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Tỷ lệ H8</text><rect x="830" y="250" width="690" height="56" fill="#FFFFFF"/><text x="845" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Cấp 1: Email &amp; FAQ</text><text x="1030" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">100 mẫu</text><text x="1110" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">9.42 / 10</text><text x="1240" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">9.25 / 10</text><text x="1390" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">98.2%</text><rect x="830" y="308" width="690" height="56" fill="#F9FAFB"/><text x="845" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Cấp 2: Tài liệu &amp; Slide</text><text x="1030" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">100 mẫu</text><text x="1110" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">9.35 / 10</text><text x="1240" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">9.10 / 10</text><text x="1390" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">97.3%</text><rect x="830" y="366" width="690" height="56" fill="#FFFFFF"/><text x="845" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Cấp 3: Dữ liệu &amp; Code</text><text x="1030" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">100 mẫu</text><text x="1110" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">9.20 / 10</text><text x="1240" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">8.92 / 10</text><text x="1390" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">97.0%</text><rect x="830" y="424" width="690" height="56" fill="#F9FAFB"/><text x="845" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Cấp 4: Agent Jira/Notion</text><text x="1030" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">100 mẫu</text><text x="1110" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">9.15 / 10</text><text x="1240" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">8.85 / 10</text><text x="1390" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">96.7%</text><rect x="830" y="482" width="690" height="56" fill="#FFFFFF"/><text x="845" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Cấp 5: Sinh ảnh Mockup</text><text x="1030" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">100 mẫu</text><text x="1110" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">8.90 / 10</text><text x="1240" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">8.75 / 10</text><text x="1390" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">98.3%</text><rect x="830" y="560" width="690" height="220" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><text x="860" y="605" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#1D4ED8">TỔNG HỢP CHẤT LƯỢNG HỆ THỐNG: 97,50%</text><text x="860" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Điểm số trung bình: VBot đạt <tspan font-weight="700">8,97 / 10</tspan> so với GPT-4o đạt <tspan font-weight="700">9,20 / 10</tspan>.</text><text x="860" y="670" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Mọi cấp độ tác vụ đều vượt xa trần chất lượng tối thiểu 95% của Ràng buộc H8.</text><text x="860" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Đạt 97,5% năng lực của model đắt đỏ nhất với <tspan font-weight="700" fill="#047857">chi phí chỉ bằng 1/7</tspan>.</text><rect x="860" y="725" width="260" height="36" rx="6" fill="#10B981"/><text x="990" y="749" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">✅ ĐẠT RÀNG BUỘC CỨNG H8</text></svg>