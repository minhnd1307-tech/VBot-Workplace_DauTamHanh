<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
</defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">Slide 10: Tính sẵn sàng cao (HA Multi-AZ) &amp; Kế hoạch Phục hồi Thảm họa (RTO ≤ 4h, RPO ≤ 1h)</text><rect x="1340" y="24" width="79.7" height="18" rx="9" fill="#202124"/><text x="1379.85" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">backup_dr</text><rect x="1340" y="46" width="72.4" height="18" rx="9" fill="#202124"/><text x="1376.2" y="59" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">database</text><rect x="30" y="90" width="740" height="710" rx="10" fill="#F5F9FF" stroke="#4285F4" stroke-width="1.5"/><text x="42" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">1. Kiến trúc Sẵn sàng Cao (Multi-AZ HA) tại Singapore</text><text x="42" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chạy trên 3 Availability Zones độc lập (asia-southeast1-a/b/c) · Không có điểm lỗi đơn (No SPOF)</text><text x="42" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Global Application Load Balancer:</text><text x="42" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Anycast IP phủ toàn cầu, health check tự động ngắt traffic pod lỗi (10-30s)</text><text x="42" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">GKE Regional Cluster (3 Zones):</text><text x="42" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· 4 app node trải đều 3 zone trong giờ hành chính</text><text x="42" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Khi 1 AZ sập: Pod ở 2 AZ còn lại tiếp tục phục vụ, Cluster Autoscaler bù node trong 2-4 phút</text><text x="42" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Cloud SQL Regional HA (PostgreSQL 16 + pgvector):</text><text x="42" y="303.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Primary (Zone a) sao chép đồng bộ mức đĩa (Regional PD) sang Standby (Zone b)</text><text x="42" y="320.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Tự động Failover trong vòng 60 giây khi Zone a gặp sự cố</text><text x="42" y="337.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· RPO = 0 đối với các giao dịch đã commit (Không mất mát dữ liệu!)</text><text x="42" y="354.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="371.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Memorystore Redis Standard HA:</text><text x="42" y="388.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Primary + Replica đa zone, tự động thăng cấp trong 30 giây</text><circle cx="50" cy="150" r="11" fill="#1A73E8"/><text x="50" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="800" y="90" width="770" height="710" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="1.5"/><text x="812" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">2. Chiến lược Sao lưu &amp; Khôi phục Thảm họa (DR Plan)</text><text x="812" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Đáp ứng nghiêm ngặt Ràng buộc cứng H7: RTO ≤ 4 giờ, RPO ≤ 1 giờ</text><text x="812" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="812" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Kế hoạch Sao lưu Dữ liệu (Backup Strategy):</text><text x="812" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Cloud SQL Automated Daily Backup: lưu 14 bản sao lưu (02:00 sáng)</text><text x="812" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Point-In-Time Recovery (PITR): ghi giữ Transaction WAL log liên tục 7 ngày</text><text x="812" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  -&gt; Cho phép khôi phục chính xác tới từng giây. RPO thực tế ≤ 5 phút!</text><text x="812" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· GCS Workspace: Bật Object Versioning + Soft Delete 7 ngày + CMEK khóa KMS</text><text x="812" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="812" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Kịch bản Khôi phục Thảm họa diện rộng (Regional Outage DR):</text><text x="812" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Thảm họa toàn Singapore sập diện rộng:</text><text x="812" y="303.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Sao lưu định kỳ sang Secondary Region: asia-southeast2 (Jakarta)</text><text x="812" y="320.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Hạ tầng dựng lại 100% bằng Terraform IaC trong 25 phút</text><text x="812" y="337.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Khôi phục Database từ bản sao lưu gần nhất: 20 phút</text><text x="812" y="354.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Tổng thời gian khôi phục (RTO thực tế) = 45 phút &lt;&lt; Cam kết 4 giờ (H7)</text><text x="812" y="371.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Chi phí: Automated backup + Cross-region storage = 59.00 USD/tháng</text><circle cx="820" cy="150" r="11" fill="#1A73E8"/><text x="820" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="830" y="580" width="710" height="190" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="842" y="603" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Bảng Cam kết Chỉ số Phục hồi (Disaster Recovery Metrics)</text><text x="850" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Chỉ số</text><text x="1020" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Yêu cầu H7</text><text x="1180" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Kiến trúc VBot</text><text x="1380" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">Đánh giá</text><path d="M 850 655 L 1510 655" fill="none" stroke="#5F6368" stroke-width="1" marker-end="url(#arr)"/><text x="850" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">RPO (Mất dữ liệu tối đa)</text><text x="1020" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">≤ 1 giờ (60 phút)</text><text x="1180" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">5 phút (PITR WAL)</text><text x="1380" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">VƯỢT CHUẨN 12x</text><text x="850" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">RTO (Thời gian phục hồi)</text><text x="1020" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">≤ 4 giờ (240 phút)</text><text x="1180" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">45 phút (Terraform IaC)</text><text x="1380" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">VƯỢT CHUẨN 5.3x</text><text x="850" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Failover nội bộ (1 AZ)</text><text x="1020" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Tự động trong SLA</text><text x="1180" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">≤ 60 giây (Multi-AZ)</text><text x="1380" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#188038">ĐẠT 99.5% UPTIME</text><rect x="30" y="818" width="1540" height="64" rx="10" fill="#EAF2FE"/><text x="50" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Thỏa mãn H7: Uptime 99.5%, Multi-AZ không điểm lỗi đơn. Failover 1 zone mất dưới 1 phút. Khôi phục toàn bộ dưới 45 phút.</text><text x="50" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368">Cloud SQL PITR 7 ngày + Backup cross-region Jakarta. Toàn bộ hạ tầng phục hồi tự động bằng mã nguồn Terraform.</text></svg>