<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F9FAFB"/>
  <text x="60" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">Slide 1: Giả định &amp; Ước lượng Tải Hệ thống từ 2.000 DAU</text>
  <text x="60" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4B5563">Mô hình toán học chuyển hóa từ quy mô người dùng đến năng lực xử lý, lưu lượng token và giờ cao điểm</text><rect x="60" y="140" width="440" height="680" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="80" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">1. Thông số nền tảng (Đề bài)</text><text x="80" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Khung giờ hành chính &amp;amp; quy mô người dùng</text><rect x="80" y="230" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">2.000 DAU</text><text x="100" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Nhân viên văn phòng hoạt động mỗi ngày</text><rect x="80" y="320" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">22 ngày / tháng</text><text x="100" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Giờ hành chính T2–T6: 8h00 – 18h00 (10h/ngày)</text><rect x="80" y="410" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">220 giờ / tháng</text><text x="100" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Tổng thời gian phục vụ có cam kết SLA 99,5%</text><rect x="80" y="500" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">25 requests / user / ngày</text><text x="100" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Mức sử dụng trung bình cho trợ lý văn phòng</text><rect x="80" y="590" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">50.000 requests / ngày</text><text x="100" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Tổng lưu lượng truy vấn toàn tập đoàn</text><rect x="80" y="680" width="400" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="100" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">1.100.000 req / tháng</text><text x="100" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">Lưu lượng tháng phục vụ tính toán chi phí token</text><rect x="530" y="140" width="540" height="680" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="550" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">2. Phân bổ 5 Cấp độ Tác vụ</text><text x="550" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Tỉ lệ lưu lượng và phân bổ Model chuyên biệt</text><rect x="550" y="220" width="500" height="98" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="570" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Cấp 1: Email &amp; FAQ (45%)</text><text x="570" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">22.500 req/ngày | In: 1.500 tok | Out: 300 tok</text><rect x="850" y="284" width="180" height="22" rx="4" fill="#10B981"/><text x="940" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Gemini 3.8 Flash</text><rect x="550" y="335" width="500" height="98" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="570" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Cấp 2: Tài liệu &amp; Slide (25%)</text><text x="570" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">12.500 req/ngày | In: 3.500 tok | Out: 800 tok</text><rect x="850" y="399" width="180" height="22" rx="4" fill="#10B981"/><text x="940" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Gemini 3.8 Flash</text><rect x="550" y="450" width="500" height="98" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="570" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Cấp 3: Dữ liệu &amp; Code Sandbox (15%)</text><text x="570" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">7.500 req/ngày | In: 4.000 tok | Out: 1.000 tok</text><rect x="850" y="514" width="180" height="22" rx="4" fill="#10B981"/><text x="940" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Gemini 3.8 Flash</text><rect x="550" y="565" width="500" height="98" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="570" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9">Cấp 4: Agent dự án Jira/Notion (12%)</text><text x="570" y="619" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">6.000 req/ngày | In: 8.000 tok | Out: 1.500 tok</text><rect x="850" y="629" width="180" height="22" rx="4" fill="#8B5CF6"/><text x="940" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Gemini Pro</text><rect x="550" y="680" width="500" height="98" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><text x="570" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Cấp 5: Mockup UI &amp; Thiết kế (3%)</text><text x="570" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563">1.500 req/ngày | In: 2.000 tok | Out: 1 ảnh</text><rect x="850" y="744" width="180" height="22" rx="4" fill="#F59E0B"/><text x="940" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Imagen 3 (Vertex AI)</text><rect x="1100" y="140" width="440" height="680" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="1120" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">3. Giờ cao điểm &amp; Cam kết SLA</text><text x="1120" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Hệ số tập trung tải k=2.5 và độ trễ H6</text><rect x="1120" y="230" width="400" height="74" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1140" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Average RPS: 1.39 req/s</text><text x="1140" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">50.000 request / 36.000 giây làm việc</text><rect x="1120" y="320" width="400" height="74" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1140" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Peak RPS: 3.5 req/s</text><text x="1140" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">k_peak = 2.5 tập trung đầu giờ 9h-10h, 14h-15h</text><rect x="1120" y="410" width="400" height="74" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1140" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Peak Input TPS: 11.000 tok/s</text><text x="1140" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">Tốc độ token đầu vào tối đa ở giờ cao điểm</text><rect x="1120" y="500" width="400" height="74" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1140" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Peak Output TPS: 2.310 tok/s</text><text x="1140" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">Tốc độ token trả về của LLM cho người dùng</text><rect x="1120" y="590" width="400" height="74" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="1140" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Cam kết p95 TTFT &lt;= 3s (H6)</text><text x="1140" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">Thực tế Gemini 3.8 Flash đạt 0.55s - 1.2s</text><rect x="1120" y="680" width="400" height="74" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="1140" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Agent chạy ngầm &lt;= 10 phút (H6)</text><text x="1140" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">Cloud Tasks queue rate limit, timeout 600s</text></svg>