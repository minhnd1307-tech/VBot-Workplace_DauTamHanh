<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
</defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">Slide 9: AI &amp; Data Governance (H4, H5) · Cloud DLP, Chống Prompt Injection &amp; HITL</text><rect x="1340" y="24" width="87" height="18" rx="9" fill="#202124"/><text x="1383.5" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">governance</text><rect x="1340" y="46" width="87" height="18" rx="9" fill="#202124"/><text x="1383.5" y="59" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">monitoring</text><rect x="30" y="90" width="480" height="710" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="42" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">1. Ba Lớp Chống Prompt Injection (H4)</text><text x="42" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Bảo vệ trước tấn công phá rào (Jailbreak, DAN, Delimiter)</text><text x="42" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Lớp 1: Semantic Classifier &amp; Regex Guardrail</text><text x="42" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Quét nhận diện mẫu: "ignore previous instructions", "DAN"</text><text x="42" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Phát hiện ký tự phân tách lạ nhằm ngắt context</text><text x="42" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Tự động từ chối và ghi log cảnh báo tức thì</text><text x="42" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Lớp 2: Prompt Hardening &amp; Delimiter Formatting</text><text x="42" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Đóng gói dữ liệu người dùng trong cặp thẻ &lt;user_input&gt;</text><text x="42" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· System prompt cố định, nghiêm cấm tiết lộ chỉ dẫn nội bộ</text><text x="42" y="303.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="42" y="320.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Lớp 3: Output Guardrail &amp; Token Leakage Check</text><text x="42" y="337.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Quét câu trả lời LLM trước khi stream về client</text><text x="42" y="354.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Chặn đứng nếu phát hiện rò rỉ mã khóa, token hoặc prompt gốc</text><circle cx="50" cy="150" r="11" fill="#1A73E8"/><text x="50" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="540" y="90" width="520" height="710" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="552" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">2. Cloud Sensitive Data Protection (DLP API - H5)</text><text x="552" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Tự động quét và che giấu (mask) dữ liệu nhạy cảm PII</text><text x="552" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Thực thi trước khi gửi sang LLM và trước khi ghi Log</text><text x="552" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="552" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Các InfoType cấu hình trong Terraform Inspect Template:</text><text x="552" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· EMAIL_ADDRESS: Ẩn email cá nhân</text><text x="552" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· PHONE_NUMBER (Vietnam): Đầu số 03, 05, 07, 08, 09</text><text x="552" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· VIETNAM_CCCD: Định dạng 12 chữ số căn cước công dân</text><text x="552" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· CREDIT_CARD_NUMBER: Visa, Mastercard 16 chữ số</text><text x="552" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="552" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Cơ chế Masking an toàn:</text><text x="552" y="303.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Thay thế chuỗi PII bằng [MASKED_TYPE] trước khi LLM xử lý</text><text x="552" y="320.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Giải mã token hoàn trả cho người dùng ở tầng API Gateway</text><text x="552" y="337.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">LLM không bao giờ nhìn thấy dữ liệu PII gốc!</text><circle cx="560" cy="150" r="11" fill="#1A73E8"/><text x="560" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1090" y="90" width="480" height="710" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="1.5"/><text x="1102" y="113.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">3. Human-in-the-Loop &amp; Audit Log 12 Tháng</text><text x="1102" y="133.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Cơ chế Human-in-the-Loop bắt buộc (H4):</text><text x="1102" y="150.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Thao tác ĐỌC (RAG, search Notion, Jira): tự động chạy</text><text x="1102" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Thao tác GHI/GỬI RA NGOÀI (send mail, create issue, delete file):</text><text x="1102" y="184.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  Agent BẮT BUỘC dừng lại và gửi popup xin xác nhận</text><text x="1102" y="201.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">  Chỉ thực thi khi người dùng click "Đồng ý"</text><text x="1102" y="218.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368"></text><text x="1102" y="235.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Audit Logging 12 Tháng (H5):</text><text x="1102" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Mọi request, prompt, response, quyết định guardrail</text><text x="1102" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Ghi vào Cloud Logging Bucket lưu trữ đúng 365 ngày</text><text x="1102" y="286.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Thiết lập Immutable Bucket Lock (WORM - chống xóa/sửa)</text><text x="1102" y="303.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">· Phục vụ thanh tra tuân thủ an toàn thông tin doanh nghiệp</text><circle cx="1110" cy="150" r="11" fill="#1A73E8"/><text x="1110" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M 510 380 L 540 380" fill="none" stroke="#202124" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1060 380 L 1090 380" fill="none" stroke="#202124" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="818" width="1540" height="64" rx="10" fill="#EAF2FE"/><text x="50" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Thỏa mãn H4 &amp; H5: Chống Prompt Injection 3 lớp, DLP che PII tự động, bắt buộc xác nhận người dùng cho hành động nhạy cảm.</text><text x="50" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368">Audit Log 12 tháng lưu bất biến tại Cloud Logging Bucket. Chi phí: DLP API 100 USD + Monitoring/Logging 40 USD = 140 USD/tháng.</text></svg>