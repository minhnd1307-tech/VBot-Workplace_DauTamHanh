<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D93025"/></marker>
</defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">Workspace riêng từng người và kiến trúc dữ liệu: cô lập ở cả 3 tầng lưu trữ</text><rect x="1120" y="24" width="72.4" height="18" rx="9" fill="#202124"/><text x="1156.2" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">database</text><rect x="1198.4" y="24" width="79.7" height="18" rx="9" fill="#202124"/><text x="1238.25" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">vector_db</text><rect x="1284.1000000000001" y="24" width="116.2" height="18" rx="9" fill="#202124"/><text x="1342.2" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">object_storage</text><rect x="1406.3000000000002" y="24" width="94.3" height="18" rx="9" fill="#202124"/><text x="1453.4500000000003" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">cache_queue</text><rect x="20" y="80" width="260" height="180" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="32" y="103.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Request của user A</text><text x="32" y="123.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">JWT từ SSO → user_id, nhóm</text><text x="32" y="140.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Gateway mở transaction:</text><text x="32" y="157.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">SET LOCAL app.user_id</text><text x="32" y="174.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">SET LOCAL app.principals</text><text x="32" y="191.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">= {user:a, group:mkt, domain}</text><rect x="20" y="300" width="260" height="180" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/><text x="32" y="323.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Sandbox gVisor (TV4)</text><text x="32" y="343.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Chỉ mount /workspace/A</text><text x="32" y="360.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Token GCS downscoped:</text><text x="32" y="377.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">chỉ prefix user-workspaces/A/</text><text x="32" y="394.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">hết hạn 15 phút</text><text x="32" y="411.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Không egress, hủy sau khi chạy</text><rect x="32" y="454" width="65.1" height="18" rx="9" fill="#202124"/><text x="64.55" y="467" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">sandbox</text><rect x="20" y="510" width="260" height="170" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="32" y="533.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">workspace-svc</text><text x="32" y="553.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Service DUY NHẤT có IAM</text><text x="32" y="570.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">trên bucket workspace</text><text x="32" y="587.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Cấp Signed URL / token</text><text x="32" y="604.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">downscoped theo user_id</text><text x="32" y="621.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Kiểm tra quota 10 GB</text><rect x="300" y="70" width="1280" height="620" rx="10" fill="#F5F9FF" stroke="#4285F4" stroke-width="2"/><text x="316" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4285F4">asia-southeast1 · chỉ Private IP (Private Service Access) · mã hóa khi lưu (CMEK cho GCS) và khi truyền (TLS)</text><rect x="320" y="106" width="610" height="284" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="332" y="129.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Cloud SQL PostgreSQL 16 · Regional HA · 4 vCPU/16 GB · 200 GB SSD</text><rect x="336" y="144" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="348" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Primary · zone a</text><text x="348" y="187.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">PITR + backup 02:00 hằng ngày</text><rect x="636" y="144" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="648" y="167.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Standby · zone b</text><text x="648" y="187.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">Failover tự động, RPO ≈ 0</text><path d="M616,179 L632,179" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="338" y="240" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#202124">chat_messages</text><text x="338" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368">lịch sử chat 12 tháng, ~84 GB</text><rect x="640" y="226" width="195.4" height="20" rx="4" fill="#FFFFFF" stroke="#188038"/><text x="648" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#188038">RLS: user_id = app.user_id</text><text x="338" y="277" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#202124">memories</text><text x="338" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368">bộ nhớ dài hạn + vector</text><rect x="640" y="263" width="195.4" height="20" rx="4" fill="#FFFFFF" stroke="#188038"/><text x="648" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#188038">RLS: user_id = app.user_id</text><text x="338" y="314" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#202124">workspace_files</text><text x="338" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368">metadata file, chặn quota 10 GB</text><rect x="640" y="300" width="229.9" height="20" rx="4" fill="#FFFFFF" stroke="#188038"/><text x="648" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#188038">RLS: user_id + path đúng prefix</text><text x="338" y="351" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#202124">chunks (pgvector)</text><text x="338" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6368">~800k chunk × 768 chiều, HNSW</text><rect x="640" y="337" width="243.70000000000002" height="20" rx="4" fill="#FFFFFF" stroke="#188038"/><text x="648" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#188038">RLS: acl_principals &amp;&amp; principals</text><rect x="950" y="106" width="610" height="284" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="962" y="129.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Memorystore Redis · Standard HA 5 GB (primary zone a, replica zone b)</text><text x="966" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Phiên + ngữ cảnh hội thoại gần nhất: key u:{uid}:session, TTL 8 giờ</text><text x="966" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Cache kết quả RAG: khóa gồm hash(principals) → khác quyền không trúng cache</text><text x="966" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Bộ đếm quota/rate limit theo user, đơn vị và theo SaaS</text><text x="966" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Cờ hủy tác vụ agent cancel:{task_id}</text><text x="966" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• AUTH + TLS trong VPC; staging dùng Redis container (nằm trong compute)</text><text x="966" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368">• Sizing: 2.000 phiên × ~200 KB + cache RAG 1–2 GB ≈ 2,5 GB → 5 GB</text><text x="966" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368">• FinOps: 5 GB (bậc M2) 273,75 USD rẻ hơn 4 GB (bậc M1) 332,88 USD</text><rect x="320" y="404" width="610" height="276" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="332" y="427.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Cloud Storage · bucket workspace · UBLA · chặn public · CMEK</text><text x="336" y="452" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#202124">gs://vbot-prod-workspaces/user-workspaces/</text><text x="356" y="474" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#202124">├─ {uid A}/ uploads/ exports/ images/ sandbox-out/</text><text x="356" y="496" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#202124">└─ {uid B}/ ...</text><rect x="336" y="512" width="180" height="58" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="348" y="535.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Standard</text><text x="348" y="555.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">0–90 ngày · 1.050 GB</text><path d="M516,541 L532,541" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="534" y="512" width="180" height="58" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="546" y="535.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Nearline</text><text x="546" y="555.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">90–365 ngày · 3.150 GB</text><path d="M714,541 L730,541" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="732" y="512" width="180" height="58" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/><text x="744" y="535.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Coldline</text><text x="744" y="555.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5F6368">&gt; 365 ngày · năm 2</text><text x="336" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368">Versioning giữ 3 bản cũ / 30 ngày · soft delete 7 ngày (khôi phục file agent ghi đè)</text><text x="336" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368">4.200 GB = 2,1 GB/user, dưới quota 10 GB · quota chặn ở DB trước khi cấp URL upload</text><text x="336" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D93025">Chỉ workspace-svc có IAM trên bucket → sandbox/agent không liệt kê</text><text x="336" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D93025">được prefix của người khác</text><rect x="950" y="404" width="610" height="276" rx="10" fill="#FFF8E6" stroke="#F9AB00" stroke-width="1.5"/><text x="962" y="427.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#202124">Cloud Tasks · hàng đợi agent chạy nền (H6) và đồng bộ connector</text><text x="966" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• agent-queue: 10 dispatch/s, 50 đồng thời, retry 3 lần, tối đa 600 s</text><text x="966" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Mỗi tác vụ cấp 4 tách ~6 bước, mỗi bước có idempotency key</text><text x="966" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Hủy: DeleteTask + cờ cancel trong Redis, worker dừng ở bước kế</text><text x="966" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• Xong → thông báo Teams/email + lưu kết quả vào workspace user</text><text x="966" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">• connector-sync-queue: 5 dispatch/s, backoff 10 s → 300 s khi 429</text><text x="966" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368">• Sizing: 132.000 tác vụ cấp 4/tháng → ~4,2 triệu operation</text><path d="M280,170 L316,200" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><path d="M280,420 L316,470" fill="none" stroke="#202124" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrR)"/><path d="M280,590 L316,590" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="704" width="1552" height="176" rx="10" fill="#E6F4EA" stroke="#188038"/><text x="40" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#188038">Chứng minh: user A không đọc được workspace hay kết quả vector của user B · tv3_data/run_isolation_test.sh (PostgreSQL 16 + pgvector 0.8): 7/7 PASS</text><text x="40" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T1</text><text x="118" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Chưa có danh tính → 0 dòng (fail-closed)</text><text x="40" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T2</text><text x="118" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Alice: thấy tài liệu riêng + toàn công ty, không thấy bảng lương</text><text x="40" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T3</text><text x="118" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Bob dùng ĐÚNG vector tài liệu riêng của Alice → 0 kết quả</text><text x="40" y="826" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T4</text><text x="118" y="826" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Bob ghi tin nhắn mang user_id của Alice → RLS chặn</text><text x="800" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T5</text><text x="878" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Bob đăng ký file trỏ sang prefix GCS của Alice → bị chặn</text><text x="800" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T6</text><text x="878" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Ghi vượt quota 10 GB → bị chặn</text><text x="800" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#188038">PASS T7</text><text x="878" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#202124">Thu hồi quyền ở SaaS → Bob mất kết quả ngay</text><text x="800" y="826" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6368">Lọc quyền nằm TRONG truy vấn ANN (RLS + hnsw.iterative_scan),</text><text x="800" y="848" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6368">không lọc sau ở ứng dụng → không rò qua top-k hay cache.</text></svg>