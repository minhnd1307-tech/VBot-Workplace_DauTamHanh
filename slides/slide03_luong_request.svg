nospace" font-size="12" fill="#fff" text-anchor="middle">cache_queue</text><line x1="1036" y1="156" x2="1036" y2="800" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="964" y="64" width="144" height="92" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="1036" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#202124" text-anchor="middle">pgvector + SQL</text><rect x="996.15" y="100" width="79.7" height="18" rx="9" fill="#202124"/><text x="1036" y="113" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">vector_db</text><rect x="999.8" y="124" width="72.4" height="18" rx="9" fill="#202124"/><text x="1036" y="137" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">database</text><line x1="1194" y1="156" x2="1194" y2="800" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1122" y="64" width="144" height="92" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="1194" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#202124" text-anchor="middle">Connector + Vault</text><rect x="1150.5" y="100" width="87" height="18" rx="9" fill="#202124"/><text x="1194" y="113" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">connectors</text><rect x="1146.85" y="124" width="94.3" height="18" rx="9" fill="#202124"/><text x="1194" y="137" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">secrets_kms</text><line x1="1352" y1="156" x2="1352" y2="800" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1280" y="64" width="144" height="92" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="1352" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#202124" text-anchor="middle">LLM GW → Vertex</text><rect x="1298.5" y="100" width="65.1" height="18" rx="9" fill="#202124"/><text x="1331.05" y="113" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">gateway</text><rect x="1369.6" y="100" width="35.9" height="18" rx="9" fill="#202124"/><text x="1387.55" y="113" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">llm</text><line x1="1510" y1="156" x2="1510" y2="800" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1438" y="64" width="144" height="92" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="1.5"/><text x="1510" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#202124" text-anchor="middle">Sandbox gVisor</text><rect x="1477.45" y="100" width="65.1" height="18" rx="9" fill="#202124"/><text x="1510" y="113" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">sandbox</text><rect x="1451.9" y="124" width="116.2" height="18" rx="9" fill="#202124"/><text x="1510" y="137" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#fff" text-anchor="middle">object_storage</text><path d="M92,196 L240,196" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="94" y="171" width="342.2" height="20" rx="4" fill="#FFFFFF"/><circle cx="106" cy="181" r="9" fill="#1A73E8"/><text x="106" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="120" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Đăng nhập SSO (OIDC/SAML) + MFA, nhận ID token</text><path d="M92,246 L398,246" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="94" y="221" width="348.90000000000003" height="20" rx="4" fill="#FFFFFF"/><circle cx="106" cy="231" r="9" fill="#1A73E8"/><text x="106" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="120" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">HTTPS /chat · WAF OWASP + rate limit · TLS 1.2+</text><path d="M408,296 L556,296" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="410" y="271" width="302" height="20" rx="4" fill="#FFFFFF"/><circle cx="422" cy="281" r="9" fill="#1A73E8"/><text x="422" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="436" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">ALB chuyển tới pod khỏe ở 1 trong 3 zone</text><path d="M566,346 L714,346" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="568" y="321" width="375.7" height="20" rx="4" fill="#FFFFFF"/><circle cx="580" cy="331" r="9" fill="#1A73E8"/><text x="580" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="594" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Xác thực JWT, RBAC → guardrail đầu vào, DLP che PII</text><path d="M724,396 L872,396" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="726" y="371" width="288.6" height="20" rx="4" fill="#FFFFFF"/><circle cx="738" cy="381" r="9" fill="#1A73E8"/><text x="738" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="752" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Prompt đã làm sạch + ngữ cảnh của user</text><path d="M882,446 L1030,446" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="884" y="421" width="335.5" height="20" rx="4" fill="#FFFFFF"/><circle cx="896" cy="431" r="9" fill="#1A73E8"/><text x="896" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="910" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">RAG: vector search, lọc theo ACL gốc của user</text><path d="M882,496 L1188,496" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="884" y="471" width="429.3" height="20" rx="4" fill="#FFFFFF"/><circle cx="896" cy="481" r="9" fill="#1A73E8"/><text x="896" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="910" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Dữ liệu SaaS mới: OAuth token của chính user, qua Cloud NAT</text><path d="M882,546 L1346,546" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="884" y="521" width="509.7" height="20" rx="4" fill="#FFFFFF"/><circle cx="896" cy="531" r="9" fill="#1A73E8"/><text x="896" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="910" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Routing theo cấp tác vụ, quota user → Vertex AI (Private Google Access)</text><path d="M1348,596 L884,596" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="884" y="571" width="248.4" height="20" rx="4" fill="#FFFFFF"/><circle cx="896" cy="581" r="9" fill="#5F6368"/><text x="896" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="910" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Stream token về (p95 TTFT ≤ 3 s)</text><path d="M882,646 L1504,646" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arr)"/><rect x="884" y="621" width="496.3" height="20" rx="4" fill="#FFFFFF"/><circle cx="896" cy="631" r="9" fill="#1A73E8"/><text x="896" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="910" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Cần chạy code: pod gVisor, không egress, chỉ mount workspace của user</text><path d="M874,696 L94,696" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="94" y="671" width="489.6" height="20" rx="4" fill="#FFFFFF"/><circle cx="106" cy="681" r="9" fill="#5F6368"/><text x="106" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">11</text><text x="120" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Hành động ghi ra ngoài (gửi email, tạo ticket) → người dùng xác nhận</text><path d="M558,746 L94,746" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="94" y="721" width="516.4000000000001" height="20" rx="4" fill="#FFFFFF"/><circle cx="106" cy="731" r="9" fill="#5F6368"/><text x="106" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12</text><text x="120" y="736" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#202124">Guardrail đầu ra → stream SSE về trình duyệt · ghi audit log + token log</text><rect x="24" y="818" width="1552" height="62" rx="10" fill="#F1F3F4"/><text x="40" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#202124">H6: chat/email/tài liệu p95 TTFT ≤ 3 s giờ cao điểm · Tác vụ dài (cấp 4) đẩy vào Cloud Tasks, worker xử lý xong ≤ 10 phút và gửi thông báo</text><text x="40" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368">H3/H4: user A không đọc được workspace, vector hay token của user B · Mọi bước ghi audit log 12 tháng (monitoring) · Nét đứt = chiều trả về</text></svg>