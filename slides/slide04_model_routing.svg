<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F9FAFB"/>
  <text x="60" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">Slide 4: Chiến lược Lựa chọn Model &amp; Dynamic Routing 5 Cấp độ</text>
  <text x="60" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4B5563">AI Gateway định tuyến thông minh: Đúng việc, Đúng Model, Tối ưu chi phí và Đòn bẩy Context Caching</text><rect x="60" y="140" width="1480" height="320" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="80" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">Sơ đồ Dynamic Routing tại AI Gateway (GKE / Vertex AI)</text><text x="80" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Phân loại Intent người dùng và chuyển phát tức thời</text><rect x="100" y="240" width="180" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><text x="190" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle">User Request</text><text x="190" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563" text-anchor="middle">2.000 DAU (50k req/ngày)</text><rect x="380" y="220" width="240" height="160" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><text x="500" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#6D28D9" text-anchor="middle">AI Gateway</text><text x="500" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="middle">• Intent Classifier</text><text x="500" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="middle">• Quota &amp; Rate Limiter (H8)</text><text x="500" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="middle">• TTFT Latency Monitor (H6)</text><rect x="740" y="190" width="460" height="70" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="760" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Cấp 1, 2, 3 (85% requests) ──► Gemini 3.8 Flash</text><text x="760" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">$0.075/1M in · $0.30/1M out · TTFT 0.55s · Context Caching giảm 75% input</text><rect x="740" y="275" width="460" height="70" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="760" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9">Cấp 4 (12% requests) ──► Gemini Pro</text><text x="760" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">$1.25/1M in · $5.00/1M out · Deep reasoning · Tool-calling Jira/Notion</text><rect x="740" y="360" width="460" height="70" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><text x="760" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">Cấp 5 (3% requests) ──► Imagen 3 on Vertex AI</text><text x="760" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4B5563">$0.030 / ảnh · 33.000 ảnh/tháng · Sinh mockup UI &amp; sơ đồ trực quan</text><path d="M 280 300 L 380 300" stroke="#1F2937" stroke-width="2" marker-end="url(#arr)"/><path d="M 620 280 L 740 225" stroke="#10B981" stroke-width="2"/><path d="M 620 300 L 740 310" stroke="#8B5CF6" stroke-width="2"/><path d="M 620 320 L 740 395" stroke="#F59E0B" stroke-width="2"/><rect x="60" y="490" width="470" height="350" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="80" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">Đòn bẩy 1: Context Caching</text><text x="80" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Tiết kiệm 350+ USD / tháng</text><text x="80" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Lưu System Instruction chuẩn &amp; tài liệu RAG cố định</text><text x="80" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Giảm <tspan font-weight="700" fill="#047857">75% đơn giá input token</tspan> (từ $0.075 còn $0.01875)</text><text x="80" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Áp dụng cho 35% lưu lượng truy vấn lặp lại</text><text x="80" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">→ Lợi thế FinOps độc quyền chỉ có trên Google Vertex AI</text><rect x="565" y="490" width="470" height="350" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="585" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">Đòn bẩy 2: Dynamic Intent Routing</text><text x="585" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Tiết kiệm 2.800+ USD / tháng</text><text x="585" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• 85% tác vụ định tuyến về Gemini 3.8 Flash</text><text x="585" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Không lãng phí gọi Model Pro cho email, FAQ đơn giản</text><text x="585" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Tiết kiệm gấp 30 lần so với phương án dùng GPT-4o</text><text x="585" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">→ Chi phí LLM chỉ còn $1.68 / DAU / tháng</text><rect x="1070" y="490" width="470" height="350" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="1090" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">Đòn bẩy 3: Quota &amp; Budget Alert (H8)</text><text x="1090" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">Kiểm soát tài chính &amp;amp; Chống lạm chi</text><text x="1090" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Quota tối đa 100.000 tokens / user / ngày</text><text x="1090" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Cloud Monitoring Alert Policy cảnh báo khi đạt 80%</text><text x="1090" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F2937">• Tự động ngắt tác vụ nặng khi chạm 100% ngân sách</text><text x="1090" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5563">→ Thỏa mãn nghiêm ngặt Ràng buộc cứng H8</text></svg>